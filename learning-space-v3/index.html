<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#15334d"><title>我的学习空间 V3 · 六科学习</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft Yahei",Arial,sans-serif;color:#203d51;background:#f5f8fb}
*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}.wrap{min-height:100vh;display:grid;grid-template-columns:225px 1fr}
nav{background:#173349;color:#e3f0f6;padding:26px 15px;display:flex;flex-direction:column;gap:4px}
.brand{font-size:21px;font-weight:800;padding:12px 12px 28px}.brand small{display:block;font-weight:400;font-size:12px;color:#aec4ce;margin-top:8px}
.navbtn{display:block;text-align:left;background:transparent;color:#c4d7e2;border:0;width:100%;padding:14px 16px;border-radius:12px;font-size:15px}
.navbtn.active{background:#31576b;color:#fff;font-weight:800}
nav .foot{margin-top:auto;font-size:12px;color:#a3b9c4;padding:14px;line-height:1.8}
main{padding:32px 4vw 65px;max-width:1260px;width:100%;margin:auto}
header{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:25px}h1{font-size:25px;margin:5px 0 0}h2{font-size:19px;margin:0 0 15px}.eyebrow{font-size:11px;letter-spacing:2px;color:#8497a6;font-weight:800}
.badge{background:#e7f5ee;color:#227b61;padding:9px 12px;border-radius:40px;font-size:11px;font-weight:800;white-space:nowrap}
.hero{border-radius:22px;background:linear-gradient(120deg,#193d54,#276779);color:#fff;padding:29px;display:flex;justify-content:space-between;gap:10px;align-items:center}.hero h2{font-size:25px;margin-bottom:10px}.hero p{font-size:13px;line-height:1.9;color:#d5e6ed;margin:0}.hero .emoji{font-size:62px}
.primary{background:#22646b;color:#fff;border:0;border-radius:12px;padding:13px 19px;font-weight:800}.primary:hover{background:#1c535a}.hero .primary{background:#d5f7e5;color:#225a50;margin-top:19px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.subject{border:1px solid #e6edf0;border-radius:17px;padding:20px;min-height:132px;text-align:left;background:#fff;box-shadow:0 7px 23px #183d5410;display:flex;justify-content:space-between}
.subject:nth-child(1){background:#ecf8f1}.subject:nth-child(2){background:#ebf3ff}.subject:nth-child(3){background:#fff4e9}.subject:nth-child(4){background:#f1efff}.subject:nth-child(5){background:#eaf8f8}.subject:nth-child(6){background:#fff6e5}
.subject strong{display:block;font-size:19px}.subject small{display:block;color:#748595;font-size:12px;margin-top:8px}.subject .ico{font-size:36px}
.sectiontitle{display:flex;align-items:center;justify-content:space-between;margin:29px 0 15px}.sectiontitle h2{margin:0}
.box{background:white;border:1px solid #e8edf1;border-radius:18px;padding:21px;box-shadow:0 4px 20px #183d5410}
.notice{background:#fff8ea;color:#80602b;border-radius:13px;padding:13px 16px;line-height:1.85;font-size:12px;margin:18px 0}
.row{display:flex;gap:12px;flex-wrap:wrap}.row>*{flex:1;min-width:155px}
.field label{display:block;font-size:12px;font-weight:700;color:#536d7e;margin-bottom:7px}.field input,.field select{width:100%;height:46px;border:1px solid #dae5ed;border-radius:10px;background:#fafdff;padding:10px;color:#203d51}
.uploader{background:#f7fbfa;border:1.5px dashed #abd2c9;border-radius:16px;padding:18px;margin-top:16px}.uploadtop{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}.uploadtop strong{font-size:14px}.uploadtop p{font-size:11px;color:#7e919a;margin:5px 0}
.addbtn{background:#dff2eb;color:#246e61;border:0;border-radius:11px;padding:12px 15px;font-weight:800}.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-top:13px}.file{border:1px solid #e4eaf0;background:#fff;padding:7px;border-radius:10px;min-width:0}
.thumb{height:86px;background:#f0f4f7;border-radius:7px;display:grid;place-items:center;overflow:hidden;font-size:28px}.thumb img{width:100%;height:100%;object-fit:cover}.file small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11px;margin:6px 1px}.file button{border:0;color:#bd4c4c;background:#fff1ef;border-radius:7px;padding:6px;font-size:11px;width:100%}
.actions{display:flex;justify-content:space-between;align-items:center;gap:9px;flex-wrap:wrap;margin-top:20px}.muted{color:#778a99;font-size:12px;line-height:1.7}
.archive{display:grid;gap:12px}.item{padding:17px 19px;background:#fff;border:1px solid #e7edf2;border-radius:14px;display:flex;justify-content:space-between;gap:14px;align-items:center}.item b{display:block}.item small{color:#8193a0;display:block;margin-top:8px;font-size:12px}.chip{font-size:12px;color:#967138;background:#fff5dd;padding:7px 10px;border-radius:30px;white-space:nowrap}
.empty{padding:40px;text-align:center;color:#8296a3}
@media(max-width:830px){.wrap{display:block}nav{height:auto;padding:10px 13px;position:sticky;top:0;z-index:5;display:flex;flex-direction:row;align-items:center;overflow:auto;white-space:nowrap;box-shadow:0 3px 17px #1a39412a}.brand{font-size:14px;padding:7px 9px;margin-right:4px}.brand small,nav .foot{display:none}.navbtn{width:auto;font-size:12px;padding:10px}.navbtn.active{border-radius:9px}main{padding:20px 17px 50px}.grid{grid-template-columns:repeat(2,1fr)}.hero{padding:22px}.hero .emoji{display:none}.hero h2{font-size:21px}h1{font-size:21px}}
@media(min-width:650px) and (max-width:830px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:360px){.grid{grid-template-columns:1fr}}
</style></head>
<body><div class="wrap"><nav><div class="brand">📖 我的学习空间<small>Personal Learning Space</small></div><button class="navbtn active" data-tab="home">🏠 首页</button><button class="navbtn" data-tab="upload">📷 上传作业</button><button class="navbtn" data-tab="archive">🗃️ 作业档案</button><button class="navbtn" data-tab="wrong">📝 错题本</button><div class="foot">六科学习 · 小米平板网页版<br>浏览器入口 V3</div></nav>
<main><header><div><div class="eyebrow">PERSONAL LEARNING SPACE</div><h1 id="heading">学习首页</h1></div><span class="badge">网页预览版</span></header><div id="content"></div></main></div>
<input type="file" id="picker" accept="image/*,.pdf,application/pdf" multiple hidden>
<script>
const SUBJECTS=[['语文','📙','阅读、作文、基础'],['数学','📐','计算、应用、代数'],['英语','📘','阅读、语法、写作'],['科学','🔬','实验、概念与推理'],['地理','🌍','地图与区域'],['人文','🏛️','历史、文化与社会']];
const state={tab:'home',subject:'数学',queue:[],records:[],db:null};
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const key=()=>String(Date.now())+'-'+Math.random().toString(36).slice(2,8);
const fmt=t=>new Date(t).toLocaleString('zh-CN',{hour12:false,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
function openDb(){return new Promise((res,rej)=>{let req=indexedDB.open('my-study-space-v3-local',1);req.onupgradeneeded=()=>req.result.createObjectStore('assignments',{keyPath:'id'});req.onsuccess=()=>res(req.result);req.onerror=()=>rej(req.error)})}
function trans(mode='readonly'){return state.db.transaction('assignments',mode).objectStore('assignments')}
async function load(){if(!state.db)return;const q=trans().getAll();return new Promise(res=>{q.onsuccess=()=>{state.records=(q.result||[]).sort((a,b)=>b.date-a.date);res()};q.onerror=()=>res()})}
function view(tab,subject){state.tab=tab;if(subject)state.subject=subject;document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));$('heading').textContent=({home:'学习首页',upload:'连续上传作业',archive:'学习档案',wrong:'错题本'})[tab];render()}
function allSubjects(){return '<div class="grid">'+SUBJECTS.map(([name,emoji,desc])=>'<button class="subject" data-subject="'+name+'"><span><strong>'+esc(name)+'</strong><small>'+desc+'</small></span><span class="ico">'+emoji+'</span></button>').join('')+'</div>'}
function home(){return '<div class="hero"><div><h2>把每天的作业，变成长期的进步。</h2><p>六个学科统一管理，连续选择多张作业照片。<br>当前先提供网页入口，正式 GPT 批改还需接入服务器。</p><button class="primary" data-tab="upload">＋ 上传今天的作业</button></div><span class="emoji">📚</span></div><div class="sectiontitle"><h2>六大学科</h2></div>'+allSubjects()+'<div class="sectiontitle"><h2>近期作业</h2></div>'+(state.records.length?cards(state.records.slice(0,5)):'<div class="box empty">还没有本地作业。点击任一学科，开始上传。</div>')+info()}
function info(){return '<div class="notice">ℹ️ 当前是<b>可在 Chrome 直接打开的网页预览版</b>，支持多图选择和本地暂存档案。<b>GPT 自动批改、跨设备同步和云端永久归档尚未上线</b>。不需要、也不要在网页里填写 GPT API 密钥。</div>'}
function upload(){return '<div class="box"><div class="row"><div class="field"><label>学科</label><select id="subject">'+SUBJECTS.map(x=>'<option '+(state.subject===x[0]?'selected ':'')+'value="'+x[0]+'">'+x[0]+'</option>').join('')+'</select></div><div class="field"><label>作业名称</label><input id="workTitle" placeholder="例如：第3单元课内作业"></div><div class="field"><label>年级</label><select id="grade"><option>六年级</option><option>五年级</option><option>七年级</option><option>其他</option></select></div></div><div class="uploader"><div class="uploadtop"><div><strong>📷 连续上传作业</strong><p>一次选多张，也可以再次追加，全部归为同一次作业</p></div><button class="addbtn" id="addFiles">＋ 选择 / 继续添加照片</button></div><div class="files" id="files"></div><div class="muted" id="count" style="margin-top:11px"></div></div><div class="actions"><span class="muted">建议按作业页码依次选择；支持照片和 PDF</span><button class="primary" id="save">保存到本机档案</button></div></div>'+info()}
function archive(){return '<div class="box" style="margin-bottom:14px"><b>🗃️ 作业档案</b><p class="muted">本地预览版使用当前浏览器存储。清除 Chrome 网站数据或换设备，可能丢失记录，不能代替正式的云端档案。</p></div>'+(state.records.length?cards(state.records):'<div class="box empty">暂无作业档案</div>')}
function cards(records){return '<div class="archive">'+records.map(r=>'<div class="item"><div><b>'+SUBJECTS.find(x=>x[0]===r.subject)?.[1]+' '+esc(r.title)+'</b><small>'+esc(r.subject)+' · '+esc(r.grade)+' · '+fmt(r.date)+' · '+r.files.length+'份附件</small></div><div><span class="chip">待 GPT 批改</span> <button class="addbtn" data-show="'+r.id+'">查看</button></div></div>').join('')+'</div>'}
function wrong(){return '<div class="box empty" style="line-height:2"><div style="font-size:36px">📝</div><b>错题本</b><div>正式批改服务上线后，会按学科自动保存错误题目、错误原因和订正状态。</div><div class="muted">目前尚未接入 GPT，因此不生成虚假的批改结果。</div></div>'}
function render(){const html={home,upload,archive,wrong}[state.tab]();$('content').innerHTML=html;if(state.tab==='upload')renderFiles()}
function renderFiles(){const c=$('files');if(!c)return;c.innerHTML='';state.queue.forEach((f,i)=>{const x=document.createElement('div');x.className='file';const t=document.createElement('div');t.className='thumb';if(f.type.startsWith('image/')){const img=document.createElement('img');img.alt='第'+(i+1)+'张';img.src=URL.createObjectURL(f);img.onload=()=>URL.revokeObjectURL(img.src);t.append(img)}else t.textContent='📄';const n=document.createElement('small');n.textContent=(i+1)+'. '+f.name;const b=document.createElement('button');b.textContent='移除';b.onclick=()=>{state.queue.splice(i,1);renderFiles()};x.append(t,n,b);c.append(x)});$('count').textContent='已添加 '+state.queue.length+' 份附件（可继续添加后一次保存）'}
function notify(msg){alert(msg)}
async function saveRecord(){const title=$('workTitle').value.trim();if(!title)return notify('请先填写作业名称');if(!state.queue.length)return notify('请先选择作业照片');if(state.queue.length>40)return notify('一次最多40个附件');const size=state.queue.reduce((sum,f)=>sum+f.size,0);if(size>90*1024*1024)return notify('文件太大，请将这次作业分批保存');if(!state.db)return notify('浏览器不支持本地存储，请尝试最新版 Chrome');const record={id:key(),date:Date.now(),title,subject:$('subject').value,grade:$('grade').value,files:state.queue.map(f=>({name:f.name,type:f.type,blob:f}))};const req=trans('readwrite').put(record);req.onsuccess=async()=>{state.queue=[];await load();view('archive');notify('作业照片已保存到当前浏览器。注意：尚未进行 GPT 自动批改。')};req.onerror=()=>notify('保存失败：浏览器存储空间不足或存储被禁用')}
async function showRecord(id){const r=state.records.find(x=>x.id===id);if(!r)return;state.tab='archive';$('heading').textContent='作业详情';document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab==='archive'));$('content').innerHTML='<div class="box"><button class="addbtn" id="back">← 返回档案</button><h2 style="margin-top:19px">'+esc(r.title)+'</h2><p class="muted">'+esc(r.subject)+' · '+fmt(r.date)+'</p><div class="files" id="preview"></div><div class="notice">这次作业尚未经过 GPT 批改；这里保存的仅是原始照片。</div></div>';const p=$('preview');r.files.forEach((f,i)=>{const x=document.createElement('div');x.className='file';const t=document.createElement('div');t.className='thumb';const b=document.createElement('button');b.textContent='查看原图 / PDF';const u=URL.createObjectURL(f.blob);if(f.type.startsWith('image/')){const img=document.createElement('img');img.src=u;img.alt='作业第'+(i+1)+'页';t.append(img)}else t.textContent='📄';b.onclick=()=>window.open(u,'_blank');const n=document.createElement('small');n.textContent=f.name;x.append(t,n,b);p.append(x)});$('back').onclick=()=>view('archive')}
document.addEventListener('click',e=>{let t=e.target.closest('[data-tab],[data-subject],[data-show],#addFiles,#save');if(!t)return;if(t.dataset.tab)return view(t.dataset.tab);if(t.dataset.subject)return view('upload',t.dataset.subject);if(t.dataset.show)return showRecord(t.dataset.show);if(t.id==='addFiles')return $('picker').click();if(t.id==='save')return saveRecord()});
document.addEventListener('change',e=>{if(e.target.id==='picker'){const f=[...e.target.files].filter(x=>x.type.startsWith('image/')||x.type==='application/pdf');state.queue.push(...f);e.target.value='';renderFiles()}if(e.target.id==='subject')state.subject=e.target.value});
(async()=>{try{state.db=await openDb();await load()}catch(e){console.warn('IndexedDB unavailable',e)}render()})();
</script></body></html>
