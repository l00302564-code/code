name: Publish Learning Space Web
on:
  push:
    branches: [main]
    paths:
      - "learning-space-v3/**"
      - ".github/workflows/learning-space-pages.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-learning-space
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload web files
        uses: actions/upload-pages-artifact@v3
        with:
          path: learning-space-v3
      - id: deployment
        name: Deploy website
        uses: actions/deploy-pages@v4
